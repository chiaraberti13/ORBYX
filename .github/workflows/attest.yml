name: Signed artifact provenance
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "assets/*.png", "assets/banner.svg"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attest:
    if: github.repository == 'chiaraberti13/ORBYX' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libopencv-dev libjsoncpp-dev qt6-base-dev qt6-qpa-plugins libgl-dev gnupg binutils
      - name: Build and test the actual desktop and headless products
        run: |
          cmake -S . -B build-provenance -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-provenance --parallel 2
          ctest --test-dir build-provenance --output-on-failure
      - name: Package binaries, corresponding source and checked digests
        run: |
          cmake --build build-provenance --target package_source
          cpack --config build-provenance/CPackConfig.cmake -G TGZ -B build-provenance/packages
          mkdir dist
          cp build-provenance/packages/*.tar.gz "dist/orbyx-${{ matrix.os }}-x86_64.tar.gz"
          cp build-provenance/*Source.tar.gz dist/
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Sign artifact provenance with repository OIDC identity
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4, resolved 2026-11-08
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Verify the real signatures and reject a modified subject
        env:
          GH_TOKEN: ${{ github.token }}
          ORBYX_ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/SHA256SUMS; do
            gh attestation verify "$artifact" \
              --bundle "$ORBYX_ATTESTATION_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attest.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --format json > "$artifact.verification.json"
          done
          cp dist/SHA256SUMS "$RUNNER_TEMP/orbyx-tampered-checksums"
          printf '\nmodified after signing\n' >> "$RUNNER_TEMP/orbyx-tampered-checksums"
          if gh attestation verify "$RUNNER_TEMP/orbyx-tampered-checksums" \
            --bundle "$ORBYX_ATTESTATION_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attest.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners > "$RUNNER_TEMP/orbyx-tamper-verification.log" 2>&1; then
            echo 'ERROR: modified content unexpectedly verified'
            exit 1
          fi
          echo 'Modified subject rejected after authentic subjects verified'
          cp "$ORBYX_ATTESTATION_BUNDLE" dist/provenance.sigstore.json
      - name: Exercise genuine verified installation and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          ORBYX_ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/orbyx-managed-update"
          package="dist/orbyx-${{ matrix.os }}-x86_64.tar.gz"
          # First signed install; then a second verified activation of the same
          # actual build to exercise rollback without inventing a release identity.
          python3 scripts/orbyx_update.py --root "$root" install --archive "$package" --bundle "$ORBYX_ATTESTATION_BUNDLE" --commit "$GITHUB_SHA"
          first=$(readlink "$root/application")
          python3 scripts/orbyx_update.py --root "$root" install --archive "$package" --bundle "$ORBYX_ATTESTATION_BUNDLE" --commit "$GITHUB_SHA"
          second=$(readlink "$root/application")
          test "$first" != "$second"
          python3 scripts/orbyx_update.py --root "$root" rollback
          "$root/application/bin/orbyx" --version
          QT_QPA_PLATFORM=offscreen "$root/application/bin/orbyx-gui" --smoke-test
          before=$(readlink "$root/application")
          cp "$package" "$RUNNER_TEMP/tampered-update.tar.gz"
          printf 'tampered' >> "$RUNNER_TEMP/tampered-update.tar.gz"
          if python3 scripts/orbyx_update.py --root "$root" install --archive "$RUNNER_TEMP/tampered-update.tar.gz" --bundle "$ORBYX_ATTESTATION_BUNDLE" --commit "$GITHUB_SHA"; then
            echo 'Tampered update accepted'; exit 1
          fi
          test "$before" = "$(readlink "$root/application")"
          echo 'Genuine Sigstore install, rollback and tamper rejection passed' | tee dist/update-verification.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbyx-signed-provenance-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
