name: CodeQL
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "assets/*.png", "assets/banner.svg"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 2'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4, verified tag 2026-11-08
        with:
          languages: c-cpp
          build-mode: manual
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libopencv-dev libjsoncpp-dev qt6-base-dev qt6-qpa-plugins libgl-dev
      - run: cmake -S . -B build -G Ninja -DORBYX_BUILD_GUI=ON -DBUILD_TESTING=OFF && cmake --build build --parallel 2
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
