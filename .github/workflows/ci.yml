name: Build and regression
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "assets/*.png", "assets/banner.svg"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libopencv-dev libjsoncpp-dev qt6-base-dev qt6-qpa-plugins libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --parallel 2
      - name: Regression and desktop smoke
        run: ctest --test-dir build --output-on-failure
      - name: Source and experimental Debian package
        run: |
          cmake --build build --target package_source
          cpack --config build/CPackConfig.cmake -G DEB -B build/packages
          dpkg-deb --info build/packages/*.deb
          sudo dpkg -i build/packages/*.deb
          orbyx --version
          QT_QPA_PLATFORM=offscreen orbyx-gui --smoke-test
          orbyx-batch --lang it --help
      - name: Runtime SBOM inventory of installed binaries
        run: |
          python3 scripts/orbyx_sbom.py "$(command -v orbyx)" "$(command -v orbyx-gui)" \
            --output "build/packages/orbyx-sbom-${{ matrix.os }}.json"
          cat "build/packages/orbyx-sbom-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbyx-${{ matrix.os }}-experimental
          path: |
            build/packages/*.deb
            build/packages/*.json
            build/*Source.tar.gz
          if-no-files-found: error
          retention-days: 14
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libopencv-dev libjsoncpp-dev
      - run: cmake -S . -B build -G Ninja -DORBYX_BUILD_GUI=OFF -DORBYX_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --inline-suppr -I include src
